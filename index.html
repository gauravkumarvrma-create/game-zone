<!DOCTYPE html>
<html lang="en">
<head>

  <title>GAME ZONE</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;

    }
    .card {
      background: #ffffff;
      max-width: 420px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      background: #1976d2;
      color: #fff;
    }
    .premium button {
      background: #7b1fa2;
    }
    small {
      color: #555;
    }

<body>

  <h1>🎮 GAME ZONE</h1>
  <p>Skill-based entertainment app on Pi Network</p>

  <!-- FREE ACCESS -->
  <div class="card">
    <h2>Free Access</h2>
    <p>Play basic games for entertainment</p>
    <button onclick="location.href='free-game.html'">
      Start Free Game
    </button>
  </div>

  <!-- PREMIUM ACCESS -->
  <div class="card premium">
    <h2>Premium Access (CRP Utility)</h2>
    <p>Available for eligible CRP holders</p>
    <button onclick="location.href='premium.html'">
      Check Eligibility
    </button>
    <br><br>
    <small>No gambling • No betting • Entertainment only</small>
  </div>

</body>
</html>
